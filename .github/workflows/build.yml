name: Build OpenWrt 25.12 for Mesh MK01K21

on:
  workflow_dispatch:
    inputs:
      openwrt_branch:
        description: 'OpenWrt Git Branch or Tag'
        required: true
        default: 'main'
        type: string
      upload_release:
        description: 'Publish GitHub Release on completion'
        required: false
        default: false
        type: boolean
  push:
    branches:
      - main
      - master
    paths:
      - 'dts/**'
      - 'files/**'
      - 'target_patches/**'
      - 'diffconfig'
      - '.github/workflows/**'

jobs:
  build:
    name: Build Firmware (Kernel 6.12 / MT7621)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free Disk Space
        run: |
          echo "Initial disk usage:"
          df -h
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          echo "Disk usage after cleanup:"
          df -h

      - name: Install Build Prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3-distutils python3-setuptools \
            rsync unzip zlib1g-dev file wget device-tree-compiler swig time xsltproc
          sudo apt-get clean

      - name: Clone OpenWrt Source
        run: |
          TARGET_BRANCH="${{ github.event.inputs.openwrt_branch || 'main' }}"
          echo "Cloning branch: $TARGET_BRANCH"
          git clone --depth 1 -b "$TARGET_BRANCH" https://github.com/openwrt/openwrt.git openwrt

      - name: Update and Install Feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Inject Device Support and Custom Files
        run: |
          echo "=== Injecting DTS ==="
          cp dts/mt7621_mesh_mk01k21.dts openwrt/target/linux/ramips/dts/

          echo "=== Injecting Target Makefile Definition ==="
          if git -C openwrt apply --check ../target_patches/0001-ramips-mt7621-add-mesh-mk01k21.patch 2>/dev/null; then
            git -C openwrt apply ../target_patches/0001-ramips-mt7621-add-mesh-mk01k21.patch
          else
            echo "Patch offset detected, appending Device/mesh_mk01k21 to mt7621.mk directly..."
            printf "\ndefine Device/mesh_mk01k21\n  \$(Device/dsa-migration)\n  \$(Device/uimage-lzma-loader)\n  IMAGE_SIZE := 16064k\n  DEVICE_VENDOR := Mesh\n  DEVICE_MODEL := MK01K21\n  DEVICE_COMPAT := mesh,mk01k21\n  DEVICE_PACKAGES := kmod-mt7915e mt7915-firmware kmod-usb3 kmod-usb-net-cdc-mbim kmod-usb-net-qmi-wwan umbim uqmi usb-modeswitch kmod-usb-serial-option kmod-usb-serial-wwan kmod-nft-mangle\nendef\nTARGET_DEVICES += mesh_mk01k21\n" >> openwrt/target/linux/ramips/image/mt7621.mk
          fi

          echo "=== Injecting Runtime Files Overlay ==="
          mkdir -p openwrt/files
          cp -r files/* openwrt/files/
          chmod +x openwrt/files/etc/init.d/* || true
          chmod +x openwrt/files/etc/uci-defaults/* || true

          echo "=== Applying diffconfig ==="
          cp diffconfig openwrt/.config

      - name: Generate Defconfig and Verify Configuration
        working-directory: openwrt
        run: |
          make defconfig
          echo "=== Selected Target Device ==="
          grep -i "CONFIG_TARGET_ramips_mt7621_DEVICE_mesh_mk01k21" .config || true
          echo "=== Selected Cellular Packages ==="
          grep -E "CONFIG_PACKAGE_(luci-proto-mbim|umbim|kmod-usb-net-cdc-mbim)" .config || true

      - name: Download Dependency Tarballs
        working-directory: openwrt
        run: |
          make download -j8
          find dl -size -1024c -exec ls -l {} +
          find dl -size -1024c -exec rm -f {} +

      - name: Compile Firmware
        working-directory: openwrt
        run: |
          echo "Compiling on $(nproc) threads..."
          make -j$(nproc) || make -j1 V=s

      - name: Organize Artifacts
        run: |
          mkdir -p release_artifacts
          cd openwrt/bin/targets/ramips/mt7621/
          
          # Copy firmware images matching mk01k21
          cp *mk01k21* ../../../../release_artifacts/ 2>/dev/null || true
          # Copy buildinfo and manifest
          cp config.buildinfo ../../../../release_artifacts/ 2>/dev/null || true
          cp *.manifest ../../../../release_artifacts/ 2>/dev/null || true

          cd ../../../../release_artifacts/
          sha256sum * > SHA256SUMS.txt
          echo "Generated Artifacts:"
          ls -lh

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-mesh-mk01k21-firmware
          path: release_artifacts/*
          retention-days: 30

      - name: Publish GitHub Release
        if: ${{ github.event.inputs.upload_release == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: openwrt-25.12-mk01k21-${{ github.run_number }}
          name: OpenWrt 25.12 for Mesh MK01K21 (Kernel 6.12)
          files: release_artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
