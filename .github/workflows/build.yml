name: Build OpenWrt 25.12 for Mesh MK01K21

on:
  workflow_dispatch:
    inputs:
      openwrt_branch:
        description: 'OpenWrt tag, branch, or full 40-char commit SHA. Defaults to the v25.12.5 release tag; a branch name is NOT reproducible because it moves.'
        required: true
        default: 'v25.12.5'
        type: string
      upload_release:
        description: 'Publish GitHub Release on completion'
        required: false
        default: false
        type: boolean
  push:
    branches:
      - main
      - master
    paths:
      - 'dts/**'
      - 'files/**'
      - 'package/**'
      - 'target_patches/**'
      - 'diffconfig'
      - '.github/workflows/**'

jobs:
  build:
    name: Build Firmware (OpenWrt 25.12 / MT7621)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Custom Modem Packages
        run: |
          git diff --check
          sh -n package/mk01k21-modem/files/usr/libexec/rpcd/mk01k21-modem
          sh -n package/mk01k21-modem/files/usr/libexec/mk01k21-modem-led
          sh -n package/mk01k21-modem/files/etc/hotplug.d/iface/30-mk01k21-modem-led
          sh -n files/usr/libexec/mk01k21-pcie0-power-probe
          sh -n files/etc/uci-defaults/98-leds
          sh -n files/etc/uci-defaults/99-cellular-setup
          sh -n tests/test-modem-backend.sh
          sh -n tests/test-modem-leds.sh
          sh tests/test-modem-backend.sh
          sh tests/test-modem-leds.sh
          node tests/test-modem-parser.js
          python3 -m json.tool package/luci-app-mk01k21-modem/root/usr/share/luci/menu.d/luci-app-mk01k21-modem.json >/dev/null
          python3 -m json.tool package/luci-app-mk01k21-modem/root/usr/share/rpcd/acl.d/luci-app-mk01k21-modem.json >/dev/null

      - name: Free Disk Space
        run: |
          echo "Initial disk usage:"
          df -h
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          echo "Disk usage after cleanup:"
          df -h

      - name: Install Build Prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3-setuptools python3-dev \
            rsync unzip zlib1g-dev file wget device-tree-compiler swig time xsltproc
          sudo apt-get clean

      - name: Clone OpenWrt Source
        run: |
          # A push build carries no dispatch input, so it falls back to this
          # value. It is the release TAG, not a branch: a branch name moves, so
          # two builds a week apart would not be the same source and neither
          # could be reproduced afterwards.
          TARGET_REF="${{ github.event.inputs.openwrt_branch || 'v25.12.5' }}"
          echo "Requested ref: $TARGET_REF"

          # "git clone -b" accepts a branch or a tag but NOT a commit, so a
          # 40-character hex ref is fetched explicitly instead. Pinning a commit
          # is the only way this build is reproducible: a branch name moves under
          # you, so two builds a week apart are not the same source.
          if printf '%s' "$TARGET_REF" | grep -qiE '^[0-9a-f]{40}$'; then
            git clone --filter=blob:none --no-checkout \
              https://github.com/openwrt/openwrt.git openwrt
            git -C openwrt fetch --depth 1 origin "$TARGET_REF"
            git -C openwrt checkout --detach FETCH_HEAD
          else
            git clone --depth 1 -b "$TARGET_REF" \
              https://github.com/openwrt/openwrt.git openwrt
          fi

          OPENWRT_SHA=$(git -C openwrt rev-parse HEAD)
          echo "OPENWRT_REF=$TARGET_REF" >> "$GITHUB_ENV"
          echo "OPENWRT_SHA=$OPENWRT_SHA" >> "$GITHUB_ENV"
          echo "::notice::OpenWrt $TARGET_REF resolved to $OPENWRT_SHA"
          git -C openwrt log -1 --format='  %h  %ci  %s'

      - name: Update and Install Feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Inject Device Support and Custom Files
        run: |
          echo "=== Injecting DTS ==="
          cp dts/mt7621_mesh_mk01k21.dts openwrt/target/linux/ramips/dts/

          echo "=== Injecting Target Makefile Definition ==="
          if git -C openwrt apply --check ../target_patches/0001-ramips-mt7621-add-mesh-mk01k21.patch 2>/dev/null; then
            git -C openwrt apply ../target_patches/0001-ramips-mt7621-add-mesh-mk01k21.patch
          else
            echo "Patch offset detected, appending Device/mesh_mk01k21 to mt7621.mk directly..."
            printf "\ndefine Device/mesh_mk01k21\n  \$(Device/dsa-migration)\n  \$(Device/uimage-lzma-loader)\n  IMAGE_SIZE := 16064k\n  DEVICE_VENDOR := Mesh\n  DEVICE_MODEL := MK01K21\n  DEVICE_COMPAT := mesh,mk01k21\n  DEVICE_PACKAGES := kmod-mt7915e kmod-mt7915-firmware kmod-mt7916-firmware kmod-usb3 kmod-usb-net-cdc-mbim kmod-usb-net-qmi-wwan umbim uqmi usb-modeswitch kmod-usb-serial-option kmod-usb-serial-wwan kmod-nft-mangle\nendef\nTARGET_DEVICES += mesh_mk01k21\n" >> openwrt/target/linux/ramips/image/mt7621.mk
          fi

          echo "=== Injecting Runtime Files Overlay ==="
          mkdir -p openwrt/files
          cp -r files/* openwrt/files/
          chmod +x openwrt/files/etc/init.d/* || true
          chmod +x openwrt/files/etc/uci-defaults/* || true

          echo "=== Injecting Custom Packages ==="
          cp -r package/mk01k21-modem openwrt/package/
          cp -r package/luci-app-mk01k21-modem openwrt/package/

          echo "=== Applying diffconfig ==="
          cp diffconfig openwrt/.config

      - name: Generate Defconfig and Verify Configuration
        working-directory: openwrt
        run: |
          make defconfig
          echo "=== Selected Target Device ==="
          grep -q "^CONFIG_TARGET_ramips_mt7621_DEVICE_mesh_mk01k21=y" .config \
            || { echo "::error::target device not selected after defconfig"; exit 1; }
          echo "  mesh_mk01k21 selected"
          echo "=== Required Packages ==="
          for sym in luci-proto-mbim umbim kmod-usb-net-cdc-mbim sms-tool \
                     mk01k21-modem luci-app-mk01k21-modem; do
            grep -q "^CONFIG_PACKAGE_$sym=y" .config \
              || { echo "::error::CONFIG_PACKAGE_$sym was dropped by defconfig"; exit 1; }
            echo "  ok  $sym"
          done

      - name: Download Dependency Tarballs
        working-directory: openwrt
        run: |
          make download -j8
          find dl -size -1024c -exec ls -l {} +
          find dl -size -1024c -exec rm -f {} +

      - name: Compile Firmware
        working-directory: openwrt
        run: |
          echo "Compiling on $(nproc) threads..."
          make -j$(nproc) || make -j1 V=s

      - name: Organize Artifacts
        run: |
          DEST="$GITHUB_WORKSPACE/release_artifacts"
          BINDIR="$GITHUB_WORKSPACE/openwrt/bin/targets/ramips/mt7621"
          mkdir -p "$DEST"

          # Copy firmware images matching mk01k21
          cp "$BINDIR"/*mk01k21* "$DEST/" 2>/dev/null || true
          # Copy buildinfo and manifest
          cp "$BINDIR"/config.buildinfo "$DEST/" 2>/dev/null || true
          cp "$BINDIR"/*.manifest "$DEST/" 2>/dev/null || true

          # Record exactly which upstream source produced this image. Without
          # this, an artifact built from a branch cannot be reproduced, because
          # nothing in the image records where the branch was pointing.
          {
            echo "openwrt_ref = ${OPENWRT_REF:-unknown}"
            echo "openwrt_sha = ${OPENWRT_SHA:-unknown}"
            echo "repo_sha    = ${{ github.sha }}"
            echo "repo_ref    = ${{ github.ref_name }}"
            echo "built_at    = $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "run_url     = ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } > "$DEST/BUILD_SOURCE.txt"
          echo "=== BUILD_SOURCE.txt ==="
          cat "$DEST/BUILD_SOURCE.txt"

          cd "$DEST"
          sha256sum * > SHA256SUMS.txt
          echo "Generated Artifacts:"
          ls -lh

          echo "=== Verifying the sysupgrade image ==="
          IMG=$(ls *squashfs-sysupgrade.bin 2>/dev/null | head -1)
          [ -n "$IMG" ] || { echo "::error::no sysupgrade image was produced"; exit 1; }

          # Firmware partition is 0x00fb0000 = 16,449,536 bytes (DTS partition@50000).
          LIMIT=16449536
          SIZE=$(wc -c < "$IMG")
          echo "  image: $IMG"
          echo "  size : $SIZE of $LIMIT bytes ($((SIZE * 100 / LIMIT))% used, $((LIMIT - SIZE)) free)"
          [ "$SIZE" -le "$LIMIT" ] || { echo "::error::image exceeds the firmware partition"; exit 1; }

          echo "=== Verifying both custom packages are installed in the image ==="
          MAN=$(ls *.manifest 2>/dev/null | head -1)
          [ -n "$MAN" ] || { echo "::error::no package manifest was produced"; exit 1; }
          for pkg in mk01k21-modem luci-app-mk01k21-modem umbim sms-tool jshn rpcd; do
            grep -q "^$pkg " "$MAN" \
              || { echo "::error::$pkg is missing from the image manifest"; exit 1; }
            echo "  ok  $pkg"
          done

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-mesh-mk01k21-firmware
          path: release_artifacts/*
          retention-days: 30

      - name: Publish GitHub Release
        if: ${{ github.event.inputs.upload_release == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: openwrt-25.12-mk01k21-${{ github.run_number }}
          name: OpenWrt 25.12 for Mesh MK01K21 (Kernel 6.12)
          files: release_artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
